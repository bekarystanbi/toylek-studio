name: Сборка APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Собрать отладочный APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Собрать release APK
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Скопировать APK в папку output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/TOYLEK-STUDIO-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output/TOYLEK-STUDIO.apk
          fi
          ls -la output

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: TOYLEK-STUDIO-APK
          path: output/*.apk
