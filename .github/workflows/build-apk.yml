name: Сборка APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Собрать APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Скопировать APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/TOYLEK-STUDIO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TOYLEK-STUDIO-APK
          path: output/*.apk
