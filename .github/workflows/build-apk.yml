name: Сборка APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Собрать APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Скопировать APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/TOYLEK-STUDIO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TOYLEK-STUDIO-APK
          path: output/*.apk
